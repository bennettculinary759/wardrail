name: Wardrail Code Scanning

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  wardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate SARIF
        continue-on-error: true
        run: node dist/cli/index.js scan . --format sarif --output wardrail.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: wardrail.sarif
          category: wardrail
      - name: Enforce critical findings
        run: node dist/cli/index.js scan . --fail-on critical --no-color
