name: False positive
description: Help make an existing rule more precise
title: "[False positive]: "
labels:
  - false-positive
  - rules
body:
  - type: markdown
    attributes:
      value: |
        False positives are treated as product bugs. Replace every real credential, hostname, and private path before submitting.
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: "WR-007"
    validations:
      required: true
  - type: textarea
    id: safe-example
    attributes:
      label: Minimal safe example
      description: Show the smallest code or configuration that triggers the rule.
      render: text
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this behavior safe?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Scan command and Wardrail version
      placeholder: "npx wardrail scan — 0.2.0"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report contains no real secret or private project data.
          required: true
