name: New rule request
description: Propose a security check with safe and dangerous examples
title: "[Rule]: "
labels:
  - enhancement
  - rules
body:
  - type: input
    id: risk
    attributes:
      label: Risk name
      placeholder: "Secret exposed through another frontend environment prefix"
    validations:
      required: true
  - type: textarea
    id: dangerous
    attributes:
      label: Dangerous example
      description: Use a synthetic value—never a real credential.
      render: text
    validations:
      required: true
  - type: textarea
    id: safe
    attributes:
      label: Safe example
      render: text
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security impact and remediation
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Authoritative reference
      placeholder: "https://official-documentation.example/security"
    validations:
      required: true
